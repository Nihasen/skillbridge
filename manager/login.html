<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coordinator & Manager Portal Login – SkillBridge</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <style>
    .manager-auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      background: radial-gradient(circle at 50% 10%, rgba(124, 58, 237, 0.1) 0%, rgba(15, 23, 42, 1) 85%);
    }

    .manager-card {
      width: 100%;
      max-width: 440px;
      background: var(--white);
      border-radius: var(--radius-xl);
      padding: 2.5rem;
      box-shadow: var(--shadow-xl);
    }
  </style>
</head>
<body>

  <div class="manager-auth-page">
    <div class="manager-card">
      <div style="text-align: center; margin-bottom: 2rem;">
        <a href="../index.html" class="brand-logo" style="justify-content: center; margin-bottom: 1.25rem;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" style="color: #7c3aed;">
            <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
            <path d="M2 17l10 5 10-5"></path>
            <path d="M2 12l10 5 10-5"></path>
          </svg>
          <span>Skill<span style="color: #7c3aed;">Bridge</span></span>
        </a>
        <div style="display: inline-block; margin-bottom: 0.5rem;" class="manager-badge">Admin & Faculty Portal</div>
        <h2>Manager Sign In</h2>
        <p class="text-sm text-muted">Campus Administrator & Peer Coordinator Portal</p>
      </div>

      <!-- Quick Demo Credentials Box -->
      <div style="background: #f5f3ff; border: 1px dashed #c4b5fd; border-radius: var(--radius-md); padding: 0.85rem; margin-bottom: 1.5rem; display: flex; align-items: center; justify-content: space-between;">
        <div>
          <div style="font-size: 0.8rem; font-weight: 700; color: #6d28d9;">Campus Admin Demo:</div>
          <div style="font-size: 0.75rem; color: var(--slate-600);">Dr. Eleanor Hayes (Coordinator)</div>
        </div>
        <button type="button" id="demo-manager-fill-btn" class="btn btn-sm" style="background: #7c3aed; color: var(--white);">1-Click Fill</button>
      </div>

      <form id="manager-login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">Administrator Email</label>
          <input type="email" id="email" class="form-control" placeholder="admin.hayes@campus.edu" required>
          <span class="form-feedback">Valid administrator email required.</span>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Security Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
          <span class="form-feedback">Password must be at least 6 characters.</span>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; background: linear-gradient(135deg, #7c3aed 0%, #4f46e5 100%); margin-top: 0.75rem;">
          Sign In to Admin Portal
          <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--slate-100); font-size: 0.85rem;">
        Are you a student? <a href="../login.html" class="font-semibold">Go to Student Login</a>
      </div>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
