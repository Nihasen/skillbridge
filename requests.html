<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learning Requests – SkillBridge</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <style>
    .status-filter-pills {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .status-filter-btn {
      padding: 0.4rem 0.9rem;
      font-size: 0.825rem;
      font-weight: 600;
      border-radius: var(--radius-full);
      background-color: var(--white);
      border: 1px solid var(--slate-200);
      color: var(--navy-700);
      cursor: pointer;
      transition: var(--transition-fast);
    }

    .status-filter-btn:hover {
      background-color: var(--slate-100);
    }

    .status-filter-btn.active {
      background-color: var(--primary);
      color: var(--white);
      border-color: var(--primary);
    }
  </style>
</head>
<body>

  <div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <a href="index.html" class="sidebar-brand">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
            <path d="M2 17l10 5 10-5"></path>
            <path d="M2 12l10 5 10-5"></path>
          </svg>
          <span>Skill<span style="color: var(--primary);">Bridge</span></span>
        </a>
        <button class="sidebar-close btn-icon-only">✕</button>
      </div>

      <div class="sidebar-content">
        <div>
          <div class="sidebar-section-title">Navigation</div>
          <nav class="sidebar-nav">
            <a href="dashboard.html" class="sidebar-link">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
              <span>Dashboard</span>
            </a>

            <a href="profile.html" class="sidebar-link">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
              <span>My Profile</span>
            </a>

            <a href="my-skills.html" class="sidebar-link">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
              <span>My Skills</span>
            </a>

            <a href="search-skills.html" class="sidebar-link">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
              <span>Search Skills</span>
            </a>

            <a href="requests.html" class="sidebar-link active">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>
              <span>Learning Requests</span>
              <span id="sidebar-request-badge" class="sidebar-badge badge-pending">1</span>
            </a>

            <a href="chat.html" class="sidebar-link">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
              <span>Chat Messenger</span>
              <span id="sidebar-chat-badge" class="sidebar-badge">2</span>
            </a>

            <a href="reviews.html" class="sidebar-link">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"></path></svg>
              <span>Ratings & Reviews</span>
            </a>

            <a href="notifications.html" class="sidebar-link">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
              <span>Notifications</span>
            </a>
          </nav>
        </div>
      </div>

      <div class="sidebar-footer">
        <div class="user-mini-card">
          <img src="" class="user-avatar dynamic-user-avatar" alt="Avatar">
          <div class="user-info">
            <div class="user-name">Alex Rivera</div>
            <div class="user-role">Computer Science</div>
          </div>
          <a href="login.html" title="Sign Out" style="color: var(--slate-400); padding: 0.35rem;">
            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
          </a>
        </div>
      </div>
    </aside>

    <!-- Main Wrapper -->
    <div class="main-wrapper">
      <header class="topbar">
        <div class="topbar-left">
          <button class="sidebar-toggle-btn">☰</button>
          <div class="page-breadcrumb">
            <a href="dashboard.html">Dashboard</a>
            <span>/</span>
            <span class="current">Learning Requests</span>
          </div>
        </div>

        <div class="topbar-right">
          <a href="notifications.html" class="icon-btn-round">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
            <span id="topbar-notif-badge" class="icon-badge"></span>
          </a>
          <img src="" class="user-avatar user-avatar-sm dynamic-user-avatar" alt="Avatar">
        </div>
      </header>

      <div class="content-container">
        <div class="page-header">
          <div>
            <h1 class="page-title">Skill Barter Requests</h1>
            <p class="page-description">Track incoming barter proposals from students and manage requests you have sent</p>
          </div>
        </div>

        <!-- Primary Tabs: Incoming vs Outgoing -->
        <div class="tabs-container">
          <button id="tab-req-incoming" class="tab-btn active">
            <span>Incoming Proposals (From Peers)</span>
          </button>
          <button id="tab-req-outgoing" class="tab-btn">
            <span>Sent Requests (My Outgoing)</span>
          </button>
        </div>

        <!-- Status Filter Pills -->
        <div class="status-filter-pills">
          <button class="status-filter-btn active" data-status="all">All Requests</button>
          <button class="status-filter-btn" data-status="pending">Pending Approval</button>
          <button class="status-filter-btn" data-status="accepted">Accepted & Active</button>
          <button class="status-filter-btn" data-status="rejected">Declined</button>
        </div>

        <!-- Requests List -->
        <div id="requests-list-container" class="requests-list">
          <!-- Dynamically populated by requests.js -->
        </div>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/requests.js"></script>
</body>
</html>
